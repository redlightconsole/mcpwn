tools:
  - name: "nmap_scan"
    description: "Nmap is a free and open source utility for network discovery and security auditing."
    command: "nmap"
    image: "parrotsec/nmap"
    args:
      - name: "target"
        description: "Target IP/Domain"
        required: true
        positional: true
      - name: "ports"
        description: "Ports to scan (e.g. '80,443' or '-p-')"
        flag: "-p"
      - name: "fast_mode"
        description: "Fast scan (-F)"
        flag: "-F"
        type: "boolean"
      - name: "service_info"
        description: "Detect service version (-sV)"
        flag: "-sV"
        type: "boolean"
      - name: "default_scripts"
        description: "Run default NSE scripts (-sC)"
        flag: "-sC"
        type: "boolean"
      - name: "os_detection"
        description: "Enable OS detection (-O)"
        flag: "-O"
        type: "boolean"
      - name: "aggressive"
        description: "Aggressive scan (-A). Includes -sV, -sC, -O and traceroute"
        flag: "-A"
        type: "boolean"
      - name: "no_ping"
        description: "Treat all hosts as online (-Pn)"
        flag: "-Pn"
        type: "boolean"
      - name: "timing"
        description: "Timing template (0-5). 4 is recommended for fast scans."
        flag: "-T"
      - name: "verbose"
        description: "Increase verbosity level (-v)"
        flag: "-v"
        type: "boolean"
      - name: "extra_args"
        description: "Any additional nmap arguments"
        flag: ""

  - name: "gobuster_dir"
    description: "Gobuster is a high-performance directory/file, DNS and virtual host brute-forcing tool written in Go."
    command: "gobuster"
    image: "parrotsec/gobuster"
    fixed_args: ["dir", "--no-error"]
    args:
      - name: "url"
        description: "Target URL"
        required: true
        flag: "-u"
      - name: "wordlist"
        description: "Path to wordlist"
        required: true
        flag: "-w"
      - name: "extensions"
        description: "File extensions (php,txt)"
        flag: "-x"
      - name: "threads"
        description: "Number of concurrent threads"
        flag: "-t"
      - name: "status_codes"
        description: "Positive status codes"
        flag: "-s"
      - name: "no_tls_validation"
        description: "Skip TLS certificate verification (-k)"
        flag: "-k"
        type: "boolean"
      - name: "useragent"
        description: "Override User-Agent string"
        flag: "-a"
      - name: "extra_args"
        description: "Any additional gobuster arguments"
        flag: ""

  - name: "ffuf_fuzz"
    description: "ffuf is a fast web fuzzer written in Go. It allows for directory discovery, parameter fuzzing and more."
    command: "ffuf"
    image: "parrotsec/ffuf"
    fixed_args: ["-s"]
    args:
      - name: "url"
        description: "Target URL containing FUZZ keyword (e.g. http://example.com/FUZZ)"
        required: true
        flag: "-u"
      - name: "wordlist"
        description: "Path to wordlist"
        required: true
        flag: "-w"
      - name: "extensions"
        description: "Comma-separated list of extensions to fuzz (e.g. .php,.txt)"
        flag: "-e"
      - name: "match_codes"
        description: "Match HTTP status codes (e.g. 200,301,403)"
        flag: "-mc"
      - name: "recursion"
        description: "Scan recursively"
        flag: "-recursion"
        type: "boolean"
      - name: "recursion_depth"
        description: "Maximum recursion depth"
        flag: "-recursion-depth"
      - name: "http_method"
        description: "HTTP method to use (default GET)"
        flag: "-X"
      - name: "timeout"
        description: "HTTP request timeout in seconds"
        flag: "-timeout"
      - name: "extra_args"
        description: "Any additional ffuf arguments"
        flag: ""

  - name: "httpx_probe"
    description: "httpx is a fast and multi-purpose HTTP toolkit that allows running multiple probes."
    command: "httpx"
    image: "projectdiscovery/httpx"
    fixed_args: ["-silent", "-nc"]
    args:
      - name: "target"
        description: "Target URL, domain or IP to probe"
        required: true
        flag: "-u"
      - name: "status_code"
        description: "Show HTTP status code"
        flag: "-sc"
        type: "boolean"
      - name: "tech_detect"
        description: "Detect technologies in use"
        flag: "-td"
        type: "boolean"
      - name: "page_title"
        description: "Show page title"
        flag: "-title"
        type: "boolean"
      - name: "follow_redirects"
        description: "Follow HTTP redirects"
        flag: "-fr"
        type: "boolean"
      - name: "show_ip"
        description: "Show target IP"
        flag: "-ip"
        type: "boolean"
      - name: "cdn_check"
        description: "Check if target is behind a CDN"
        flag: "-cdn"
        type: "boolean"
      - name: "web_server"
        description: "Show web server header"
        flag: "-web-server"
        type: "boolean"
      - name: "extra_args"
        description: "Any additional httpx arguments"
        flag: ""

  - name: "sqlmap"
    description: "sqlmap is an open source penetration testing tool that automates the process of detecting and exploiting SQL injection flaws."
    command: "sqlmap"
    image: "parrotsec/sqlmap"
    fixed_args: ["--batch", "--random-agent"]
    args:
      - name: "url"
        description: "Target URL (e.g. http://www.example.com/vuln.php?id=1)"
        required: true
        flag: "-u"
      - name: "risk"
        description: "Risk level (1-3, default 1)"
        flag: "--risk"
      - name: "level"
        description: "Level of tests to perform (1-5, default 1)"
        flag: "--level"
      - name: "parameter"
        description: "Testable parameter(s) (e.g. 'id')"
        flag: "-p"
      - name: "dbms"
        description: "Force back-end DBMS to this value (e.g. 'mysql')"
        flag: "--dbms"
      - name: "enumerate_dbs"
        description: "Enumerate database management system databases"
        flag: "--dbs"
        type: "boolean"
      - name: "enumerate_tables"
        description: "Enumerate DBMS database tables"
        flag: "--tables"
        type: "boolean"
      - name: "dump"
        description: "Dump DBMS database table entries"
        flag: "--dump"
        type: "boolean"
      - name: "proxy"
        description: "Use a proxy to connect to the target URL"
        flag: "--proxy"
      - name: "extra_args"
        description: "Any additional sqlmap arguments"
        flag: ""

  - name: "msfvenom"
    description: "Metasploit payload generator. Used to create reverse shells, etc..."
    command: "msfvenom"
    image: "parrotsec/metasploit-framework"
    args:
      - name: "payload"
        description: "Payload to use (e.g., windows/x64/meterpreter/reverse_tcp)"
        flag: "-p"
        required: true
      - name: "options"
        description: "Additional options (format: LHOST=IP LPORT=PORT)"
        flag: ""
      - name: "format"
        description: "Output format (exe, elf, raw, python, etc.)"
        flag: "-f"

  - name: "msfconsole_run"
    description: "Run specific Metasploit commands non-interactively."
    command: "msfconsole"
    image: "parrotsec/metasploit-framework"
    fixed_args: ["-q", "-n"]
    args:
      - name: "commands"
        description: "Commands to execute (e.g., 'use auxiliary/scanner/portscan/tcp; set RHOSTS 192.168.1.1; run; exit')"
        flag: "-x"
        required: true
      - name: "extra_args"
        description: "Any additional msfconsole arguments"
        flag: ""
