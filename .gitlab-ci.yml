stages:
  - validate
  - release

validate:
  stage: validate
  image: golang:1.24
  variables:
    GOFLAGS: -mod=vendor
  script:
    - go test ./...
    - go vet ./...
    - go build -o /tmp/mcpwn ./cmd/mcpwn

release:
  stage: release
  image:
    name: goreleaser/goreleaser:latest
    entrypoint: [""]
  only:
    - tags
  variables:
    GIT_DEPTH: 0
  script:
    - goreleaser release --clean
  artifacts:
    paths:
      - dist/